name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Har 12 ghante me update hoga
  
  workflow_dispatch: # Manual run ke liye

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate space-shooter.svg
        uses: czl9707/gh-space-shooter@main
        with:
          # Yahan automatically aapka username (madhavgadge01) fetch ho jayega
          github_user_name: ${{ github.repository_owner }}

      - name: Push space-shooter.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
